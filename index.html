<script>
const $=s=>document.querySelector(s),P=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const FA={ATL:'آتلانتا هاوکس',BOS:'بوستون سلتیکس',BKN:'بروکلین نتس',CHA:'شارلوت هورنتس',CHI:'شیکاگو بولز',CLE:'کلیولند کاوالیرز',DAL:'دالاس ماوریکس',DEN:'دنور ناگتس',DET:'دیترویت پیستونز',GS:'گلدن‌استیت واریرز',GSW:'گلدن‌استیت واریرز',HOU:'هیوستون راکتس',IND:'ایندیانا پیسرز',LAC:'لس‌آنجلس کلیپرز',LAL:'لس‌آنجلس لیکرز',MEM:'ممفیس گریزلیز',MIA:'میامی هیت',MIL:'میلواکی باکس',MIN:'مینه‌سوتا تیمبرولوز',NO:'نیواورلینز پلیکنز',NOP:'نیواورلینز پلیکنز',NY:'نیویورک نیکس',NYK:'نیویورک نیکس',OKC:'اوکلاهوما سیتی تاندر',ORL:'اورلاندو مجیک',PHI:'فیلادلفیا سونی‌سرز',PHX:'فینیکس سانز',POR:'پورتلند ترایل‌بلیزرز',SAC:'ساکرامنتو کینگز',SA:'سن‌آنتونیو اسپرز',SAS:'سن‌آنتونیو اسپرز',TOR:'تورنتو رپترز',UTAH:'یوتا جاز',UTA:'یوتا جاز',WSH:'واشنگتن ویزاردز',WAS:'واشنگتن ویزاردز'};
const fa=t=>FA[t.abbreviation]||t.displayName||t.abbreviation;
const API='https://site.api.espn.com/apis/site/v2/sports/basketball/nba',STAND='https://site.api.espn.com/apis/v2/sports/basketball/nba/standings';
const LK={p:['امتیاز','offensive.avgPoints','avgPoints'],r:['ریباند','general.avgRebounds','avgRebounds'],a:['پاس گل','offensive.avgAssists','avgAssists'],s:['سرقت','defensive.avgSteals','avgSteals'],b:['بلاک','defensive.avgBlocks','avgBlocks']};
const leadURL=k=>'https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/statistics/byathlete?region=us&lang=en&contentorigin=espn&isqualified=true&limit=20&sort='+encodeURIComponent(LK[k][1]+':desc');
let cache=new Map();
const via=[x=>'https://corsproxy.io/?url='+encodeURIComponent(x),x=>'https://api.allorigins.win/raw?url='+encodeURIComponent(x),x=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(x),x=>'https://thingproxy.freeboard.io/fetch/'+x];
let direct=true;
const one=async url=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}};
const hop=async u=>{if(direct)try{return await one(u)}catch(e){direct=false}
 try{return await Promise.any(via.map(f=>one(f(u))))}catch(e){throw new Error('network')}};
const get=u=>{if(!cache.has(u))cache.set(u,hop(u).catch(e=>{cache.delete(u);throw e}));return cache.get(u)};
const etToday=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
const add=(iso,n)=>{const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fmt=iso=>new Date(iso+'T12:00:00Z').toLocaleDateString('fa-IR',{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'UTC'});
let cur=etToday(),tab='day',all=false,sk='pts',G=[],S=null,LD=null,tok=0,lk='p',first=true;
try{tab=localStorage.getItem('tab')||'day';document.documentElement.dataset.t=localStorage.getItem('th')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark')}catch(e){document.documentElement.dataset.t='dark'}

const badge=p=>{const c=[p.pts,p.reb,p.ast].filter(x=>x>=10).length;return c>=3?'تریپل‌دابل':p.pts>=40?'۴۰+ امتیاز':c==2?'دابل‌دابل':''};
function players(g){const out=[];g.bx=[];(g.box?.players||[]).forEach((grp,gi)=>{const st=grp.statistics?.[0];if(!st)return;const L=st.labels||[],iP=L.indexOf('PTS'),iR=L.indexOf('REB'),iA=L.indexOf('AST');
 const tm=g.teams.find(x=>x.t.id==grp.team?.id)||g.teams[gi],op=g.teams.find(x=>x!==tm),rows=[];
 (st.athletes||[]).forEach(a=>{if(!a.stats||!a.stats.length||iP<0)return;const p={n:a.athlete.displayName,tm,op,pts:+a.stats[iP]||0,reb:+a.stats[iR]||0,ast:+a.stats[iA]||0};out.push(p);rows.push({n:p.n,s:a.stats})});
 g.bx.push({tm,L,rows})});return out}
async function loadDay(iso){const sb=await get(`${API}/scoreboard?dates=${iso.replace(/-/g,'')}&limit=50`);
 const gs=(sb.events||[]).map(e=>{const c=e.competitions[0],ty=e.status.type;
  return{id:e.id,state:ty.state,detail:ty.shortDetail,date:e.date,teams:[...c.competitors].sort((a,b)=>a.homeAway=='away'?-1:1).map(k=>({t:k.team,score:+k.score||0,win:!!k.winner}))}});
 await Promise.allSettled(gs.filter(g=>g.state!='pre').map(async g=>{g.box=(await get(`${API}/summary?event=${g.id}`)).boxscore}));
 gs.forEach(g=>g.pl=players(g));return gs}
async function loadStand(){const d=await get(STAND);return(d.children||[]).map(c=>({name:c.name,rows:(c.standings?.entries||[]).map(e=>{const o={};(e.stats||[]).forEach(s=>o[s.name]=s);
 return{t:e.team,w:o.wins?.value||0,l:o.losses?.value||0,pct:o.winPercent?.value??0,st:o.streak?.displayValue,seed:o.playoffSeed?.value||99}}).sort((a,b)=>a.seed-b.seed||b.pct-a.pct)}))}
async function loadLead(k){const d=await get(leadURL(k)),nm=LK[k][2];const val=(a,n)=>{for(const c of a.categories||[]){const i=(c.names||[]).indexOf(n);if(i>=0){const v=(c.values||c.totals||[])[i];return typeof v=='number'?v:parseFloat(v)}}return NaN};
 return(d.athletes||[]).map(a=>({n:a.athlete.displayName,tm:a.athlete.teamShortName||a.athlete.teamName||'',v:val(a,nm),g:val(a,'gamesPlayed')})).filter(x=>!isNaN(x.v)).sort((x,y)=>y.v-x.v)}
const COL=Object.fromEntries("ATL:E03A3E,BOS:007A33,BKN:444444,CHA:1D1160,CHI:CE1141,CLE:860038,DAL:00538C,DEN:1D428A,DET:C8102E,GS:1D428A,GSW:1D428A,HOU:CE1141,IND:002D62,LAC:C8102E,LAL:552583,MEM:5D76A9,MIA:98002E,MIL:00471B,MIN:236192,NO:0C2340,NOP:0C2340,NY:006BB6,NYK:006BB6,OKC:007AC1,ORL:0077C0,PHI:006BB6,PHX:E56020,POR:E03A3E,SAC:5A2D81,SA:666666,SAS:666666,TOR:CE1141,UTAH:4E008E,UTA:4E008E,WSH:002B5C,WAS:002B5C".split(',').map(x=>x.split(':')));
function lf(i){const s=+i.dataset.s||0;i.dataset.s=s+1;if(s==0&&i.dataset.u)i.src='https://images.weserv.nl/?url='+encodeURIComponent(i.dataset.u.replace(/^https?:\/\//,''));else{i.parentNode.classList.add('nb');i.remove()}}
const logo=t=>{const u=t.logo||t.logos?.[0]?.href||`https://a.espncdn.com/i/teamlogos/nba/500/${String(t.abbreviation).toLowerCase()}.png`,c=COL[t.abbreviation]||t.color||'667799';
 return`<span class="lg" style="--c:#${String(c).replace('#','')}"><b class="ab">${t.abbreviation}</b><img src="${u}" data-u="${u}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="lf(this)"></span>`};
const ts=(g,t,n)=>{const v=g.box?.teams?.find(x=>x.team?.id==t.t.id)?.statistics?.find(s=>s.name==n)?.displayValue;return v?P(v):'–'};
const status=g=>g.state=='in'?`<span class="live">${P(g.detail)}</span>`:g.state=='pre'?'شروع: '+P(new Date(g.date).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})):'پایان بازی';
const empty=m=>`<div class="raise empty">${m}</div>`;
const tg=p=>badge(p)?`<span class="tag">${badge(p)}</span>`:'';

function listHTML(L){const R=all?L:L.slice(0,5),mx=L[0][sk]||1;return R.map((p,i)=>`<div class="pl"><span class="rk">${P(i+1)}</span><div><b><bdi>${p.n}</bdi></b>${tg(p)} <span class="mu">${fa(p.tm.t)}</span><div class="track"><div class="fill" style="width:${p[sk]/mx*100}%"></div></div></div><span class="sc">${P(p[sk])}</span></div>`).join('')+(L.length>5?`<div style="text-align:center;padding:10px"><button class="btn" id="more">${all?'نمایش کمتر':'نمایش بیشتر'}</button></div>`:'')}

// دریافت داده از ESPN روی سرور گیت‌هاب و ذخیره در پوشه data (برای کار کردن سایت بدون VPN)
import fs from 'node:fs/promises';
const API = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const STAND = 'https://site.api.espn.com/apis/v2/sports/basketball/nba/standings';
const LEAD = 'https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/statistics/byathlete?region=us&lang=en&contentorigin=espn&isqualified=true&limit=20&sort=offensive.avgPoints%3Adesc';
const get = async u => { const r = await fetch(u, { headers: { 'user-agent': 'Mozilla/5.0' } }); if (!r.ok) throw new Error(r.status + ' ' + u); return r.json(); };
const et = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
const add = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
await fs.mkdir('data', { recursive: true });
const keep = new Set(['standings.json', 'leaders.json']); let failed = false;
for (let n = -4; n <= 1; n++) {
  const ymd = add(et, n).replace(/-/g, ''); keep.add(`day-${ymd}.json`);
  try {
    const sb = await get(`${API}/scoreboard?dates=${ymd}&limit=50`);
    await fs.writeFile(`data/day-${ymd}.json`, JSON.stringify(sb));
    for (const e of sb.events || []) {
      const f = `event-${e.id}.json`; keep.add(f); const state = e.status.type.state;
      if (state === 'pre') continue;
      if (state === 'post') { try { if (JSON.parse(await fs.readFile('data/' + f, 'utf8')).final) continue; } catch {} }
      try { const s = await get(`${API}/summary?event=${e.id}`); await fs.writeFile('data/' + f, JSON.stringify({ boxscore: s.boxscore, final: state === 'post' })); }
      catch (err) { failed = true; console.warn(err.message); }
    }
  } catch (err) { failed = true; console.warn(err.message); }
}
for (const [f, u] of [['standings.json', STAND], ['leaders.json', LEAD]]) {
  try { await fs.writeFile('data/' + f, JSON.stringify(await get(u))); } catch (err) { console.warn(err.message); }
}
if (!failed) for (const f of await fs.readdir('data')) if (!keep.has(f)) await fs.unlink('data/' + f);
