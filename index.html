<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بسکت‌آمار NBA | امتیازآورهای روز، نتایج و جدول</title>
<meta name="description" content="آمار روزانه NBA: برترین امتیازآورها، نتایج و آمار تیمی بازی‌ها و جدول رده‌بندی دو کنفرانس.">
<meta property="og:title" content="بسکت‌آمار NBA"><meta property="og:description" content="آمار روزانه NBA">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ebf2;--tx:#2d3748;--mu:#6b778a;--ac:#f26b21;--lt:#fff;--dk:#bcc4d2;--ok:#2f9e6b;--no:#d9534f;--r:22px}
[data-t=dark]{--bg:#22262e;--tx:#e8ebf1;--mu:#9aa4b5;--lt:#2e333d;--dk:#161a20}
*{box-sizing:border-box;margin:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7;min-height:100vh;transition:background .3s}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.wrap{max-width:1120px;margin:auto;padding:16px}
.raise{background:var(--bg);border-radius:var(--r);box-shadow:6px 6px 14px var(--dk),-6px -6px 14px var(--lt)}
.inset{background:var(--bg);border-radius:14px;box-shadow:inset 5px 5px 10px var(--dk),inset -5px -5px 10px var(--lt)}
.btn{border:0;cursor:pointer;background:var(--bg);border-radius:14px;padding:8px 16px;box-shadow:5px 5px 10px var(--dk),-5px -5px 10px var(--lt);transition:.15s}
.btn:active,.btn.on{box-shadow:inset 4px 4px 8px var(--dk),inset -4px -4px 8px var(--lt);color:var(--ac);font-weight:800}
.btn:disabled{opacity:.4;cursor:default}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:1.5rem}
.ball{--s:56px;width:var(--s);height:var(--s);border-radius:50%;position:relative;overflow:hidden;flex:none;background:radial-gradient(circle at 30% 28%,#ffa45e,#f26b21 55%,#b44a10);box-shadow:inset -6px -8px 14px rgba(0,0,0,.35),8px 12px 20px var(--dk),-6px -6px 14px var(--lt)}
.ball::before,.ball::after{content:"";position:absolute;background:rgba(40,18,6,.6)}
.ball::before{left:50%;top:0;width:3px;height:100%;margin-left:-1.5px}
.ball::after{top:50%;left:0;height:3px;width:100%;margin-top:-1.5px}
.ball i::before,.ball i::after{content:"";position:absolute;top:6%;width:70%;height:88%;border-radius:50%;border:3px solid rgba(40,18,6,.6)}
.ball i::before{left:-48%}.ball i::after{right:-48%}
.ball.big{--s:84px}
@keyframes spin{to{transform:rotate(25deg) translateY(-6px)}}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=date],input[type=search]{border:0;padding:8px 12px;border-radius:14px;background:var(--bg);box-shadow:inset 4px 4px 8px var(--dk),inset -4px -4px 8px var(--lt)}
input[type=search]{width:100%}
nav.tabs{display:flex;gap:12px;margin-top:14px;overflow-x:auto;padding:8px 4px 14px}
nav.tabs .btn{white-space:nowrap}
.date{color:var(--mu);margin:8px 4px 18px}
h2{font-size:1.25rem;font-weight:800;margin:26px 4px 14px}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:24px}
.hero h3{font-size:clamp(1.3rem,4vw,2.1rem);font-weight:900;line-height:1.3}
.mu{color:var(--mu)}
.big-n{font-size:clamp(3rem,10vw,5.5rem);font-weight:900;color:var(--ac);line-height:1;text-align:center;text-shadow:3px 3px 6px var(--dk),-3px -3px 6px var(--lt)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.chip{padding:4px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:28px}
[data-tilt]{transition:transform .18s ease-out;will-change:transform}
.game{padding:18px}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 4px}
.row b{font-size:1.4rem}.row.w{font-weight:800;color:var(--ac)}
.lg{width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;margin-left:10px;vertical-align:middle;font-size:.7rem;font-weight:800;overflow:hidden;flex:none;box-shadow:inset 3px 3px 6px var(--dk),inset -3px -3px 6px var(--lt)}
.lg img{width:28px;height:28px;object-fit:contain}
.st{font-size:.8rem;margin-bottom:6px;color:var(--mu)}
.live{color:var(--no);font-weight:800}.live::before{content:"● "}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{color:var(--mu);font-weight:600}
th,td{padding:7px 6px;text-align:center;white-space:nowrap}
td:nth-child(2),th:nth-child(2){text-align:right}
.mini{margin-top:12px;padding:8px}
.mini td:first-child{color:var(--mu);text-align:right}
.best{margin-top:10px;font-size:.85rem;color:var(--mu)}
.list{padding:10px 18px}
.pl{display:grid;grid-template-columns:34px 1fr 60px;gap:12px;align-items:center;padding:12px 0}
.track{height:14px;border-radius:8px;margin-top:4px;overflow:hidden}
.fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#ff9a52,var(--ac));box-shadow:2px 2px 5px var(--dk)}
.rk{font-weight:900;color:var(--mu);text-align:center}
.sc{font-weight:900;font-size:1.3rem;text-align:left}
.scroll{overflow-x:auto;padding:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:24px}
.empty{padding:30px;text-align:center;color:var(--mu)}
.seg{display:flex;gap:10px;margin:0 0 14px;flex-wrap:wrap}
bdi{unicode-bidi:isolate}
footer{text-align:center;color:var(--mu);font-size:.8rem;padding:30px 0 40px}
@media(max-width:640px){.hero{grid-template-columns:1fr;text-align:center}.hero .ball{margin:auto}.chips{justify-content:center}.wrap{padding:12px}}
@media(prefers-reduced-motion:reduce){.ball.big{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="top">
  <div class="logo">بسکت‌آمار NBA</div>
  <div class="ctrl">
   <button class="btn" id="nx" aria-label="روز بعد">›</button>
   <input type="date" id="dt" aria-label="انتخاب تاریخ">
   <button class="btn" id="pv" aria-label="روز قبل">‹</button>
   <button class="btn" id="td">امروز</button>
   <button class="btn" id="th" aria-label="تغییر تم">🌙</button>
  </div>
 </div>
 <nav class="tabs">
  <button class="btn on" data-tab="day">برترین‌های روز</button>
  <button class="btn" data-tab="games">بازی‌ها</button>
  <button class="btn" data-tab="table">جدول رده‌بندی</button>
 </nav>
</div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer>منبع: ESPN · وقت شرق آمریکا</footer>

<script>
const $=s=>document.querySelector(s),P=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const FA={ATL:'آتلانتا هاوکس',BOS:'بوستون سلتیکس',BKN:'بروکلین نتس',CHA:'شارلوت هورنتس',CHI:'شیکاگو بولز',CLE:'کلیولند کاوالیرز',DAL:'دالاس ماوریکس',DEN:'دنور ناگتس',DET:'دیترویت پیستونز',GS:'گلدن‌استیت واریرز',GSW:'گلدن‌استیت واریرز',HOU:'هیوستون راکتس',IND:'ایندیانا پیسرز',LAC:'لس‌آنجلس کلیپرز',LAL:'لس‌آنجلس لیکرز',MEM:'ممفیس گریزلیز',MIA:'میامی هیت',MIL:'میلواکی باکس',MIN:'مینه‌سوتا تیمبرولوز',NO:'نیواورلینز پلیکنز',NOP:'نیواورلینز پلیکنز',NY:'نیویورک نیکس',NYK:'نیویورک نیکس',OKC:'اوکلاهوما سیتی تاندر',ORL:'اورلاندو مجیک',PHI:'فیلادلفیا سونی‌سرز',PHX:'فینیکس سانز',POR:'پورتلند ترایل‌بلیزرز',SAC:'ساکرامنتو کینگز',SA:'سن‌آنتونیو اسپرز',SAS:'سن‌آنتونیو اسپرز',TOR:'تورنتو رپترز',UTAH:'یوتا جاز',UTA:'یوتا جاز',WSH:'واشنگتن ویزاردز',WAS:'واشنگتن ویزاردز'};
const fa=t=>FA[t.abbreviation]||t.displayName||t.abbreviation;
const API='https://site.api.espn.com/apis/site/v2/sports/basketball/nba',STAND='https://site.api.espn.com/apis/v2/sports/basketball/nba/standings';
let cache=new Map();
const hop=async u=>{for(const f of [x=>x,x=>'https://corsproxy.io/?url='+encodeURIComponent(x),x=>'https://api.allorigins.win/raw?url='+encodeURIComponent(x)]){const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);try{const r=await fetch(f(u),{signal:c.signal});if(r.ok)return await r.json()}catch(e){}finally{clearTimeout(t)}}throw new Error('network')};
const get=u=>{if(!cache.has(u))cache.set(u,hop(u).catch(e=>{cache.delete(u);throw e}));return cache.get(u)};
const etToday=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
const add=(iso,n)=>{const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fmt=iso=>new Date(iso+'T12:00:00Z').toLocaleDateString('fa-IR',{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'UTC'});
let cur=etToday(),tab='day',all=false,sk='pts',G=[],S=null,tok=0;
try{tab=localStorage.getItem('tab')||'day';document.documentElement.dataset.t=localStorage.getItem('th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.t='light'}

function players(g){const out=[];(g.box?.players||[]).forEach((grp,gi)=>{const st=grp.statistics?.[0];if(!st)return;const L=st.labels||[],iP=L.indexOf('PTS'),iR=L.indexOf('REB'),iA=L.indexOf('AST');
 const tm=g.teams.find(x=>x.t.id==grp.team?.id)||g.teams[gi],op=g.teams.find(x=>x!==tm);
 (st.athletes||[]).forEach(a=>{if(!a.stats||!a.stats.length||iP<0)return;out.push({n:a.athlete.displayName,tm,op,pts:+a.stats[iP]||0,reb:+a.stats[iR]||0,ast:+a.stats[iA]||0})})});return out}
async function loadDay(iso){const sb=await get(`${API}/scoreboard?dates=${iso.replace(/-/g,'')}&limit=50`);
 const gs=(sb.events||[]).map(e=>{const c=e.competitions[0],ty=e.status.type;
  return{id:e.id,state:ty.state,detail:ty.shortDetail,date:e.date,teams:[...c.competitors].sort((a,b)=>a.homeAway=='away'?-1:1).map(k=>({t:k.team,score:+k.score||0,win:!!k.winner,rec:k.records?.[0]?.summary}))}});
 await Promise.allSettled(gs.filter(g=>g.state!='pre').map(async g=>{g.box=(await get(`${API}/summary?event=${g.id}`)).boxscore}));
 gs.forEach(g=>g.pl=players(g));return gs}
async function loadStand(){const d=await get(STAND);return(d.children||[]).map(c=>({name:c.name,rows:(c.standings?.entries||[]).map(e=>{const o={};(e.stats||[]).forEach(s=>o[s.name]=s);
 return{t:e.team,w:o.wins?.value||0,l:o.losses?.value||0,pct:o.winPercent?.value??0,gb:o.gamesBehind?.displayValue,df:(o.pointDifferential||o.differential)?.displayValue,st:o.streak?.displayValue,seed:o.playoffSeed?.value||99}}).sort((a,b)=>a.seed-b.seed||b.pct-a.pct)}))}

const logo=t=>`<span class="lg">${t.logo?`<img src="${t.logo}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`;
const ts=(g,t,n)=>{const v=g.box?.teams?.find(x=>x.team?.id==t.t.id)?.statistics?.find(s=>s.name==n)?.displayValue;return v?P(v):'–'};
const status=g=>g.state=='in'?`<span class="live">${P(g.detail)}</span>`:g.state=='pre'?'شروع: '+P(new Date(g.date).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})):'پایان بازی';
const empty=m=>`<div class="raise empty">${m}</div>`;

function listHTML(L){const R=all?L:L.slice(0,10),mx=L[0][sk]||1;return R.map((p,i)=>`<div class="pl"><span class="rk">${P(i+1)}</span><div><b><bdi>${p.n}</bdi></b> <span class="mu">${fa(p.tm.t)}</span><div class="track inset"><div class="fill" style="width:${p[sk]/mx*100}%"></div></div></div><span class="sc">${P(p[sk])}</span></div>`).join('')+(L.length>10?`<div style="text-align:center;padding:10px"><button class="btn" id="more">${all?'نمایش کمتر':'نمایش بیشتر'}</button></div>`:'')}
function vDay(){const L=G.flatMap(g=>g.pl);if(!L.length)return empty(G.length?'بازی‌های این روز هنوز شروع نشده‌اند. از زبانه «بازی‌ها» ساعت شروع را ببینید.':'در این تاریخ بازی‌ای برگزار نمی‌شود. روز دیگری را انتخاب کنید.');
 L.sort((a,b)=>b[sk]-a[sk]||b.pts-a.pts);const top=[...L].sort((a,b)=>b.pts-a.pts)[0],live=G.some(g=>g.state=='in');
 return`<div class="raise hero"><span class="ball big"><i></i></span><div><small class="mu">${live?'بیشترین امتیاز تا این لحظه':'بیشترین امتیاز روز'}</small><h3><bdi>${top.n}</bdi></h3><div class="mu">${fa(top.tm.t)} مقابل ${fa(top.op.t)} · ${P(top.reb)} ریباند · ${P(top.ast)} پاس گل</div></div><div><div class="big-n">${P(top.pts)}</div><div class="mu" style="text-align:center">امتیاز</div></div></div>
 <div class="seg" style="margin-top:32px">${[['pts','امتیاز'],['reb','ریباند'],['ast','پاس گل']].map(([k,l])=>`<button class="btn ${k==sk?'on':''}" data-sk="${k}">${l}</button>`).join('')}</div><div class="raise list" id="lst">${listHTML(L)}</div>`}
function vGames(){if(!G.length)return empty('در این تاریخ بازی‌ای برگزار نمی‌شود. روز دیگری را انتخاب کنید.');
 const R=[['شوت میدانی','fieldGoalPct','٪'],['ریباند','totalRebounds',''],['پاس گل','assists','']];
 return`<div class="grid">${G.map(g=>{const [a,b]=g.teams,m=Math.max(a.score,b.score),best=[...g.pl].sort((x,y)=>y.pts-x.pts)[0],v=(t,k,u)=>{const x=ts(g,t,k);return x=='–'?x:x+u};
 return`<article class="raise game" data-tilt><div class="st">${status(g)}</div>${g.teams.map(t=>`<div class="row ${g.state=='post'&&t.score==m?'w':''}"><span>${logo(t.t)}${fa(t.t)}</span><b>${g.state=='pre'?'–':P(t.score)}</b></div>`).join('')}
 ${g.box?`<table class="inset mini"><tr><th></th><th>${a.t.abbreviation}</th><th>${b.t.abbreviation}</th></tr>${R.map(([l,k,u])=>`<tr><td>${l}</td><td>${v(a,k,u)}</td><td>${v(b,k,u)}</td></tr>`).join('')}</table>${best?`<div class="best">برترین: <b style="color:var(--tx)"><bdi>${best.n}</bdi></b> با ${P(best.pts)} امتیاز</div>`:''}`:''}</article>`}).join('')}</div>`}
function vTable(){return`<div class="two">${S.map(c=>`<div class="raise scroll"><h3 style="margin-bottom:8px">${c.name.includes('East')?'کنفرانس شرق':c.name.includes('West')?'کنفرانس غرب':c.name}</h3><table><tr><th>#</th><th>تیم</th><th>برد</th><th>باخت</th><th>روند</th></tr>${c.rows.map((e,i)=>`<tr><td>${P(i+1)}</td><td>${logo(e.t)}${fa(e.t)}</td><td>${P(e.w)}</td><td>${P(e.l)}</td><td dir="ltr" style="color:var(--${String(e.st).startsWith('W')?'ok':'no'})">${e.st?P(e.st):'–'}</td></tr>`).join('')}</table></div>`).join('')}</div>`}

function draw(){const iso=cur;$('#dt').value=iso;$('#th').textContent=document.documentElement.dataset.t=='dark'?'☀️':'🌙';
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab==tab));
 $('#app').innerHTML=(tab=='table'?'':`<div class="date">${fmt(cur)}</div>`)+(tab=='table'?(S?.length?vTable():empty('جدول در دسترس نیست.')):tab=='games'?vGames():vDay());
 document.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{sk=b.dataset.sk;draw()});
 const mb=$('#more');if(mb)mb.onclick=()=>{all=!all;draw()};
 tilt()}
function tilt(){if(!matchMedia('(hover:hover)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 document.querySelectorAll('[data-tilt]').forEach(el=>{const k=el.classList.contains('scroll')||el.classList.contains('hero')?2:7;el.onpointermove=e=>{const b=el.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;el.style.transform=`perspective(900px) rotateX(${-y*k}deg) rotateY(${x*k}deg) translateZ(6px)`};el.onpointerleave=()=>el.style.transform=''})}
async function load(){const my=++tok;$('#app').innerHTML=empty('در حال دریافت آمار…');
 try{if(tab=='table')S=await loadStand();else G=await loadDay(cur);if(my==tok)draw()}
 catch(e){console.error(e);if(my==tok)$('#app').innerHTML=`<div class="raise empty">دریافت داده ناموفق بود (${e.message}). اگر ESPN یا VPN/فیلتر روی اینترنت شما محدودیت دارد، آن را بررسی کنید و دوباره تلاش کنید.<br><br><button class="btn" id="rt">تلاش دوباره</button></div>`,$('#rt').onclick=load}}
const go=d=>{cur=d;load()};
$('#nx').onclick=()=>go(add(cur,1));$('#pv').onclick=()=>go(add(cur,-1));$('#td').onclick=()=>go(etToday());
$('#dt').onchange=e=>e.target.value&&go(e.target.value);
$('#th').onclick=()=>{const n=document.documentElement.dataset.t=='dark'?'light':'dark';document.documentElement.dataset.t=n;try{localStorage.setItem('th',n)}catch(e){}draw()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;try{localStorage.setItem('tab',tab)}catch(e){}load()});
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowLeft')go(add(cur,1));if(e.key=='ArrowRight')go(add(cur,-1))});
setInterval(()=>{if(document.hidden||tab=='table'||!G.some(g=>g.state=='in'))return;cache=new Map();load()},60000);
(async()=>{$('#app').innerHTML=empty('در حال دریافت آمار…');/* اگر امروز هنوز بازی تمام‌شده‌ای نیست، تا ۴ روز قبل را بررسی کن */
 try{for(let i=0;i<4;i++){const g=await loadDay(cur);if(g.some(x=>x.state!='pre'))break;cur=add(cur,-1)}}catch(e){}
 load()})();
</script>
</body>
</html>
